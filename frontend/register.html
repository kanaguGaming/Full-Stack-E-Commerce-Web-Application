<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | KG STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">KG STORE</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="cart.html" class="cart-icon">
                    🛒 Cart
                    <span id="cart-count" style="display: none;">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2 class="section-title">Create Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" required minlength="6">
                    <div id="pwd-error" class="error-message">Passwords do not match</div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
                <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
                    Already have an account? <a href="login.html" style="color: var(--primary-color);">Login here</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            
            const errEl = document.getElementById('pwd-error');
            
            if (password !== confirm) {
                errEl.style.display = 'block';
                return;
            }
            errEl.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                if (res.ok) {
                    showToast('Registration successful! Please login.');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    const err = await res.json();
                    showToast(err.detail || 'Registration failed', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
            }
        });
    </script>
</body>
</html>
