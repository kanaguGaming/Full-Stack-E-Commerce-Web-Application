<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | KG STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">KG STORE Admin</a>
            <nav class="nav-links">
                <a href="index.html">Storefront</a>
                <button class="btn btn-outline" onclick="logout()">Logout</button>
            </nav>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="admin-nav">
                <a href="#" class="active" onclick="switchTab('dashboard', this)">Dashboard</a>
                <a href="#" onclick="switchTab('products', this)">Products</a>
                <a href="#" onclick="switchTab('orders', this)">Orders</a>
                <a href="#" onclick="switchTab('users', this)">Users</a>
            </nav>
        </aside>

        <main class="admin-content">
            <!-- Dashboard Tab -->
            <div id="tab-dashboard">
                <h2 style="margin-bottom: 1.5rem;">Overview</h2>
                <div class="stats-grid" id="stats-container">
                    <!-- Stats loaded here -->
                </div>
            </div>

            <!-- Products Tab -->
            <div id="tab-products" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>Products Management</h2>
                    <button class="btn btn-primary" onclick="openProductModal()">Add New Product</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products-table"></tbody>
                    </table>
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="tab-orders" style="display: none;">
                <h2 style="margin-bottom: 1.5rem;">Orders Management</h2>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>User ID</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-orders-table"></tbody>
                    </table>
                </div>
            </div>

            <!-- Users Tab -->
            <div id="tab-users" style="display: none;">
                <h2 style="margin-bottom: 1.5rem;">Registered Users</h2>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody id="admin-users-table"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Product</h3>
                <button class="close-modal" onclick="closeProductModal()">&times;</button>
            </div>
            <form id="product-form" onsubmit="handleProductSubmit(event)">
                <input type="hidden" id="prod-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="prod-name" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prod-desc" required rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="prod-cat" required>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Price (₹)</label>
                        <input type="number" id="prod-price" required min="0" step="0.01">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Stock</label>
                        <input type="number" id="prod-stock" required min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="prod-image" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Product</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
    <script>
        function switchTab(tabId, el) {
            document.querySelectorAll('.admin-nav a').forEach(a => a.classList.remove('active'));
            el.classList.add('active');
            
            document.querySelectorAll('[id^="tab-"]').forEach(div => div.style.display = 'none');
            document.getElementById(`tab-${tabId}`).style.display = 'block';
            
            if (tabId === 'dashboard') loadDashboard();
            if (tabId === 'products') loadProducts();
            if (tabId === 'orders') loadOrders();
            if (tabId === 'users') loadUsers();
        }

        async function loadDashboard() {
            const stats = await fetchStats();
            if (stats) {
                document.getElementById('stats-container').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-icon">📦</div>
                        <div class="stat-info">
                            <h3>Total Products</h3>
                            <p>${stats.total_products}</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-info">
                            <h3>Total Users</h3>
                            <p>${stats.total_users}</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🛍️</div>
                        <div class="stat-info">
                            <h3>Total Orders</h3>
                            <p>${stats.total_orders}</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">₹</div>
                        <div class="stat-info">
                            <h3>Total Revenue</h3>
                            <p>₹${stats.total_revenue.toFixed(2)}</p>
                        </div>
                    </div>
                `;
            }
        }

        async function loadProducts() {
            const products = await fetchAdminProducts();
            const tbody = document.getElementById('admin-products-table');
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td><img src="${p.image_url}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 4px;"></td>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>₹${p.price.toFixed(2)}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Edit</button>
                        <button class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.8rem; color: var(--danger); border-color: var(--danger);" onclick="delProduct(${p.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadOrders() {
            const orders = await fetchAllOrders();
            const tbody = document.getElementById('admin-orders-table');
            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>User ${o.user_id}</td>
                    <td>₹${o.total_amount.toFixed(2)}</td>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>
                        <select onchange="changeOrderStatus(${o.id}, this.value)" style="background: rgba(15,23,42,0.5); color: white; border: 1px solid var(--border-color); padding: 0.2rem 0.5rem; border-radius: 4px;">
                            ${['Order Placed', 'Confirmed', 'Processing', 'Shipped', 'Out for Delivery', 'Delivered', 'Cancelled'].map(s => 
                                `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s}</option>`
                            ).join('')}
                        </select>
                    </td>
                    <td>
                        <button class="btn btn-outline" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;" onclick="alert('Phone: ${o.phone}\\nAddress: ${o.delivery_address}, ${o.city} - ${o.pincode}')">View Details</button>
                    </td>
                </tr>
            `).join('');
        }

        async function loadUsers() {
            const users = await fetchAllUsers();
            const tbody = document.getElementById('admin-users-table');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td><span class="badge ${u.role === 'ADMIN' ? 'badge-primary' : 'badge-warning'}">${u.role}</span></td>
                    <td>${new Date(u.created_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        function openProductModal() {
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('modal-title').textContent = 'Add Product';
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        function editProduct(p) {
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-desc').value = p.description;
            document.getElementById('prod-cat').value = p.category;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-stock').value = p.stock;
            document.getElementById('prod-image').value = p.image_url;
            document.getElementById('modal-title').textContent = 'Edit Product';
            document.getElementById('product-modal').style.display = 'flex';
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const data = {
                name: document.getElementById('prod-name').value,
                description: document.getElementById('prod-desc').value,
                category: document.getElementById('prod-cat').value,
                price: parseFloat(document.getElementById('prod-price').value),
                stock: parseInt(document.getElementById('prod-stock').value),
                image_url: document.getElementById('prod-image').value
            };

            let res;
            if (id) {
                res = await updateProduct(id, data);
            } else {
                res = await createProduct(data);
            }

            if (res.ok) {
                showToast(`Product ${id ? 'updated' : 'created'} successfully`);
                closeProductModal();
                loadProducts();
            } else {
                showToast('Operation failed', 'error');
            }
        }

        async function delProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                const res = await deleteProduct(id);
                if (res.ok) {
                    showToast('Product deleted');
                    loadProducts();
                }
            }
        }

        async function changeOrderStatus(id, status) {
            const res = await updateOrderStatus(id, status);
            if (res.ok) {
                showToast('Order status updated');
            } else {
                showToast('Failed to update status', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
