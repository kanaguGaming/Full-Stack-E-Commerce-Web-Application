<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | KG STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">KG STORE</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="orders.html">My Orders</a>
                <a href="cart.html" class="cart-icon" style="color: var(--primary-color);">
                    🛒 Cart
                    <span id="cart-count" style="display: none;">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">My Shopping Cart</h2>
        
        <div id="cart-content" style="display: flex; flex-wrap: wrap; gap: 2rem;">
            <div style="flex: 2; min-width: 300px; overflow-x: auto;">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cart-items">
                        <!-- Cart items will be loaded here -->
                    </tbody>
                </table>
            </div>
            
            <div style="flex: 1; min-width: 250px;">
                <div class="cart-summary">
                    <h3 style="margin-bottom: 1.5rem;">Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">₹0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery:</span>
                        <span>₹50.00</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Total:</span>
                        <span id="total">₹0.00</span>
                    </div>
                    <a href="checkout.html" class="btn btn-primary" style="width: 100%; text-align: center; margin-top: 1.5rem; display: block;">Proceed to Checkout</a>
                    <a href="index.html" class="btn btn-outline" style="width: 100%; text-align: center; margin-top: 1rem; display: block;">Continue Shopping</a>
                </div>
            </div>
        </div>
        
        <div id="empty-cart" style="display: none; text-align: center; padding: 4rem 0;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🛒</div>
            <h3 style="margin-bottom: 1rem;">Your cart is empty</h3>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Looks like you haven't added any items yet.</p>
            <a href="index.html" class="btn btn-primary">Start Shopping</a>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        function renderCart() {
            const tbody = document.getElementById('cart-items');
            const content = document.getElementById('cart-content');
            const empty = document.getElementById('empty-cart');
            
            if (cart.length === 0) {
                content.style.display = 'none';
                empty.style.display = 'block';
                return;
            }
            
            content.style.display = 'flex';
            empty.style.display = 'none';
            
            let subtotal = 0;
            
            tbody.innerHTML = cart.map(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                return `
                    <tr>
                        <td style="display: flex; align-items: center; gap: 1rem;">
                            <img src="${item.image_url || 'https://via.placeholder.com/50'}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                            ${item.name}
                        </td>
                        <td>₹${item.price.toFixed(2)}</td>
                        <td>
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="updateQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="quantity-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
                            </div>
                        </td>
                        <td>₹${itemTotal.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-outline" style="padding: 0.25rem 0.5rem; border-color: var(--danger); color: var(--danger);" onclick="removeFromCart(${item.id})">Remove</button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            document.getElementById('subtotal').textContent = `₹${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `₹${(subtotal + 50).toFixed(2)}`;
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
