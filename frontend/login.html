<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KG STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">KG STORE</a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="cart.html" class="cart-icon">
                    🛒 Cart
                    <span id="cart-count" style="display: none;">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2 class="section-title">Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
                <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
                    Don't have an account? <a href="register.html" style="color: var(--primary-color);">Register here</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const formData = new URLSearchParams();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (res.ok) {
                    const data = await res.json();
                    setToken(data.access_token, data.role);
                    showToast('Login successful!');
                    setTimeout(() => {
                        window.location.href = data.role === 'ADMIN' ? 'admin.html' : 'index.html';
                    }, 1000);
                } else {
                    const err = await res.json();
                    showToast(err.detail || 'Login failed', 'error');
                }
            } catch (err) {
                showToast('Network error', 'error');
            }
        });
    </script>
</body>
</html>
